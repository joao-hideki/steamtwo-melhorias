name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steamtwo
          POSTGRES_PASSWORD: steamtwo
          POSTGRES_DB: steamtwo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamtwo -d steamtwo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://steamtwo:steamtwo@localhost:5432/steamtwo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes (unitários, API e integração com PostgreSQL) + build + Sites
        run: npm run verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack completa e checa a API
        run: |
          docker compose up --build -d postgres migrate api
          for i in $(seq 1 30); do curl -fs http://localhost:3001/api/health && break; sleep 2; done
          curl -fs http://localhost:3001/api/health | grep '"connected"'
          curl -fs "http://localhost:3001/api/games?q=cyberpunk" | grep cyberpunk-2077
      - if: always()
        run: docker compose logs && docker compose down -v
